name: gold-alerts
on:
  schedule:
    - cron: "*/15 * * * *"     # price check every 15 minutes
    - cron: "17 3 1,15 * *"    # keepalive on the 1st and 15th (stops GitHub's 60-day pause)
  workflow_dispatch:
    inputs:
      test:
        description: "Also send a test message"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TARGET_10G_MYR: ${{ secrets.TARGET_10G_MYR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: alerts_state.json
          key: gold-state-${{ github.run_id }}
          restore-keys: gold-state-
      - name: Send test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python3 alerts.py --test
      - name: Check gold price
        run: python3 alerts.py --once

  keepalive:
    if: ${{ github.event.schedule == '17 3 1,15 * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record activity so the schedule never pauses
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || echo "nothing to commit"
          git push
